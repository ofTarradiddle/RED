name: Refresh ETF data and site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 05:35 UTC daily; weekend and holiday expenses accrue too.
    - cron: '35 5 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-spy.yml
