name: Refresh REDI comparison app

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hetzerk-public-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2026-sep-red
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-shadow.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publisher and market data dependencies
        run: python -m pip install -r requirements-shadow.txt
      - name: Validate comparison data and calculations
        run: |
          python -m pytest tests/test_comparison_data.py tests/site/test_comparison_release.py -q
          node --test tests/comparison-math.test.cjs
      - uses: actions/cache/restore@v4
        with:
          path: data/etf_comparison.json
          key: comparison-yahoo-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: comparison-yahoo-v1-${{ runner.os }}-
      - name: Refresh daily peer histories
        run: python -m scripts.refresh_comparison --strict
      - uses: actions/cache/save@v4
        with:
          path: data/etf_comparison.json
          key: comparison-yahoo-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Build updated public site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
          INNOVATION_LEADERBOARD_URL: ${{ vars.INNOVATION_LEADERBOARD_URL }}
        run: python -m publishing.build --base-path "$PAGES_BASE_PATH" --site-url "$PAGES_SITE_URL" --indexable
      - name: Package only the generated public site
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          release = Path('dist').resolve(strict=True)
          for path in ('README.md', 'lib', 'scripts', 'data/shadow_spy', 'perspective-7f3c9e', 'shadow-nav.html'):
              if (release / path).exists():
                  raise SystemExit('Private or source files must not enter Pages')
          shutil.copytree(release, '.pages', symlinks=False)
          Path('.pages/.nojekyll').touch()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated comparison data
        id: deployment
        uses: actions/deploy-pages@v4
